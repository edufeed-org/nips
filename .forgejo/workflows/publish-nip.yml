name: Publish NIP to Nostr

on:
  push:
    branches:
      - edufeed-amb

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nak
        run: |
          NAK_URL=$(curl -s https://api.github.com/repos/fiatjaf/nak/releases/latest \
            | grep -o 'https://[^"]*linux-amd64')
          curl -sL "$NAK_URL" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak

      - name: Install pandoc
        run: apt-get update && apt-get install -y pandoc

      - name: Publish as Custom NIP (kind 30817)
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_NSEC }}
        run: |
          nak event \
            -k 30817 \
            -c @edufeed.md \
            -t d=edufeed-amb \
            -t 'title=Edufeed: AMB-NIP' \
            -t k=30142 \
            wss://relay.damus.io \
            wss://nos.lol \
            wss://relay.nostr.band \
            wss://relay.edufeed.org

      - name: Convert to Asciidoc
        run: pandoc -f markdown -t asciidoc edufeed.md -o edufeed.adoc

      - name: Publish as Wiki entry (kind 30818)
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_NSEC }}
        run: |
          nak event \
            -k 30818 \
            -c @edufeed.adoc \
            -t d=edufeed-amb-nip \
            -t 'title=Edufeed: AMB-NIP' \
            wss://relay.damus.io \
            wss://nos.lol \
            wss://relay.nostr.band \
            wss://relay.edufeed.org
