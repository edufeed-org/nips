name: Publish NIP to Nostr

on:
  push:
    branches:
      - edufeed-amb

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nak
        run: |
          NAK_URL=$(curl -s https://api.github.com/repos/fiatjaf/nak/releases/latest \
            | grep -o 'https://[^"]*linux-amd64')
          curl -sL "$NAK_URL" -o /usr/local/bin/nak
          chmod +x /usr/local/bin/nak

      - name: Install pandoc
        run: apt-get update && apt-get install -y pandoc

      - name: Publish all NIPs
        env:
          NOSTR_SECRET_KEY: ${{ secrets.NOSTR_NSEC }}
        run: |
          RELAYS="wss://relay.damus.io wss://nos.lol wss://relay.nostr.band wss://nip85.brainstorm.world wss://relay.edufeed.org"

          publish() {
            local file=$1 kind=$2
            local slug=$(echo "$file" | tr '[:upper:]' '[:lower:]')
            local dtag="edufeed-${slug}"
            local title="NIP-${file}"

            echo "Publishing ${title}..."
            nak event -k 30817 -c "@${file}.md" -t "d=${dtag}" -t "title=${title}" -t "k=${kind}" $RELAYS
            pandoc -f markdown -t asciidoc "${file}.md" -o "${file}.adoc"
            nak event -k 30818 -c "@${file}.adoc" -t "d=${dtag}-nip" -t "title=${title}" $RELAYS
          }

          publish AMB 30142
          publish VOCAB 39737
